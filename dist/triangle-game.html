<title>可可三角研究所｜甜甜幾何冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#38201b;--muted:#90736a;--cream:#fff9ef;--paper:#fffdf8;--cocoa:#55291f;--pink:#ef8f8b;--mint:#a9cbbb;--gold:#f2cc72}*{box-sizing:border-box}body{margin:0;background:#f7eadd;color:var(--ink);font-family:'Nunito','Noto Sans TC',sans-serif;min-height:100vh;background-image:radial-gradient(#e8ccba 1px,transparent 1px);background-size:24px 24px}.topbar{height:68px;background:#fffaf4;border-bottom:1px solid #ead8c8;display:flex;align-items:center;justify-content:space-between;padding:0 6vw}.brand{font-size:17px;font-weight:900;letter-spacing:.02em;display:flex;align-items:center;gap:9px}.brand .mark{width:32px;height:32px;background:#54281e;border-radius:10px;color:#ffdf9e;display:grid;place-items:center;font-size:18px}.top-right{display:flex;align-items:center;gap:18px;font-size:13px;font-weight:800}.score-pill{border:1px solid #eddccf;background:#fff;border-radius:999px;padding:7px 13px;color:#8d6658}.game-wrap{max-width:1030px;margin:0 auto;padding:35px 24px 48px}.eyebrow{font-size:11px;color:#a57865;font-weight:900;letter-spacing:.17em;text-transform:uppercase}.heading{display:flex;justify-content:space-between;align-items:flex-end;margin:8px 0 22px}.heading h1{font-size:29px;line-height:1.3;margin:0;letter-spacing:-.04em}.heading p{color:var(--muted);font-size:13px;margin:7px 0 0}.choc-stamp{color:#9e715d;background:#fff7eb;border:1px solid #ebd9c8;padding:8px 12px;border-radius:9px;font-size:11px;font-weight:900;transform:rotate(2deg)}.progress-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}.progress-track{height:5px;background:#e8d5c6;border-radius:9px;flex:1;overflow:hidden}.progress-fill{height:100%;width:33.333%;background:linear-gradient(90deg,#9b533c,#d68a62);border-radius:9px;transition:width .4s}.progress-label{font-size:11px;font-weight:900;color:#8a695b}.stage-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.stage-step{height:36px;display:flex;align-items:center;gap:9px;padding:0 12px;color:#a89587;border-bottom:2px solid #e9d8ca;font-size:11px;font-weight:800}.stage-step.active{color:#5b2d22;border-color:#ae6345}.stage-step.done{color:#789181;border-color:#a8c5b2}.stage-num{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#eee4da;font-size:10px}.active .stage-num{background:#623426;color:white}.done .stage-num{background:#a9cbbb;color:white}.game-card{background:var(--paper);border:1px solid #ead8c8;border-radius:15px;overflow:hidden;box-shadow:0 10px 35px #74452c10}.card-header{padding:21px 27px 18px;border-bottom:1px solid #efe4d9;display:flex;justify-content:space-between;align-items:flex-start}.level-tag{font-size:10px;font-weight:900;letter-spacing:.12em;color:#b17c60;text-transform:uppercase}.card-header h2{font-size:20px;margin:4px 0 3px;font-weight:900;letter-spacing:-.025em}.card-header p{font-size:12px;color:#92786d;margin:0}.difficulty{font-size:10px;font-weight:900;color:#a96757;background:#fff2e9;padding:6px 10px;border-radius:6px;white-space:nowrap}.card-body{display:grid;grid-template-columns:1.08fr .92fr;min-height:314px}.diagram-side{padding:18px 18px 14px 24px;border-right:1px solid #efe4d9;display:flex;flex-direction:column}.diagram-label{display:flex;align-items:center;gap:7px;font-size:10px;color:#9b8274;font-weight:800}.diagram-label:before{content:'';width:6px;height:6px;background:#c88867;border-radius:2px}.canvas-wrap{position:relative;flex:1;min-height:220px;margin-top:6px}.canvas-wrap canvas{width:100%!important;height:100%!important;display:block}.diagram-note{font-size:10px;color:#a08b7d;text-align:center;margin:2px 0 0}.question-side{padding:26px 27px;display:flex;flex-direction:column}.question-kicker{font-size:10px;color:#b17c60;font-weight:900;letter-spacing:.11em}.question-title{font-size:18px;line-height:1.55;font-weight:900;margin:8px 0 5px}.question-hint{font-size:11px;color:#987e71;line-height:1.7;margin:0 0 17px}.answers{display:grid;gap:8px}.answer{height:42px;border:1px solid #eaded3;background:#fffdfa;border-radius:8px;display:flex;align-items:center;text-align:left;padding:0 12px;cursor:pointer;color:#51382f;font-family:inherit;font-weight:800;font-size:12px;transition:.15s}.answer:hover{border-color:#cc9878;background:#fff8f0;transform:translateY(-1px)}.answer.selected{border-color:#9b6048;background:#fff4e9;box-shadow:0 0 0 2px #9b60481a}.answer.correct{border-color:#89b299;background:#eff8f0}.answer.wrong{border-color:#d79088;background:#fff0ed}.answer-key{display:grid;place-items:center;width:22px;height:22px;background:#f5ece2;border-radius:6px;margin-right:10px;color:#9b705e;font-size:10px}.answer.selected .answer-key{background:#9b6048;color:white}.feedback{min-height:27px;margin:8px 0 0;font-size:11px;font-weight:800;line-height:1.5}.feedback.good{color:#62846c}.feedback.bad{color:#b76e61}.feedback.info{color:#9a7766}.card-footer{min-height:60px;padding:12px 24px;border-top:1px solid #efe4d9;display:flex;align-items:center;justify-content:space-between;background:#fffdfa}.mascot-line{display:flex;align-items:center;gap:9px;color:#8c776b;font-size:10px;font-weight:700}.mascot{width:30px;height:30px;border-radius:10px;background:#f5e8d8;display:grid;place-items:center;font-size:18px}.primary-btn{border:0;background:#593024;color:#fff6e8;border-radius:7px;padding:10px 17px;font:800 11px inherit;font-family:inherit;cursor:pointer;transition:.15s}.primary-btn:hover{background:#754030;transform:translateY(-1px)}.primary-btn:disabled{opacity:.42;cursor:not-allowed;transform:none}.footer-meta{font-size:10px;color:#a08a7c}.modal-scrim{position:fixed;inset:0;background:#29161170;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal-scrim.show{display:flex}.modal{width:min(430px,100%);background:#fffaf3;border:1px solid #ead7c6;border-radius:17px;padding:30px;text-align:center;box-shadow:0 25px 80px #28150e40;animation:pop .25s ease-out}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}.modal-emoji{font-size:45px}.modal h2{font-size:25px;margin:8px 0}.modal p{color:#8d7569;font-size:13px;line-height:1.8;margin:0 auto 19px;max-width:330px}.modal-score{font-size:12px;font-weight:900;color:#a16a4e;background:#f8ecdf;border-radius:8px;padding:10px;margin:0 auto 18px;max-width:180px}.modal .primary-btn{font-size:12px;padding:12px 22px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,12px);opacity:0;background:#48271f;color:#fff6e7;border-radius:99px;padding:10px 17px;font-size:11px;font-weight:800;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:700px){.topbar{padding:0 18px}.game-wrap{padding:26px 14px 35px}.heading{align-items:flex-start}.heading h1{font-size:24px}.choc-stamp{font-size:9px;padding:7px}.card-header{padding:17px 17px}.card-header h2{font-size:17px}.card-body{grid-template-columns:1fr}.diagram-side{border-right:0;border-bottom:1px solid #efe4d9;min-height:270px;padding:14px 17px}.canvas-wrap{min-height:215px}.question-side{padding:20px 18px 13px}.question-title{font-size:17px}.card-footer{padding:10px 15px}.mascot-line{max-width:65%}.footer-meta{display:none}}@media(max-width:380px){.stage-step{padding:0 6px;font-size:10px;gap:5px}.stage-num{width:18px;height:18px}.top-right{gap:7px;font-size:11px}}
</style></head>
<body><header class="topbar"><div class="brand"><span class="mark">▦</span>可可三角研究所</div><div class="top-right"><span id="topLevel">第一關・可可工坊</span><span class="score-pill">✦ <span id="scoreDisplay">0</span> 可可星</span></div></header>
<main class="game-wrap"><div class="eyebrow">COCOA GEOMETRY CLUB　 /　 JUNIOR HIGH · GRADE 9</div><div class="heading"><div><h1>甜甜的三角形冒險</h1><p>跟著可可仔一起解開幾何謎題，收集閃亮的可可星！</p></div><div class="choc-stamp">✦ 巧克力任務簿 ✦</div></div>
<div class="progress-row"><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><div class="progress-label" id="progressLabel">1 / 3 關</div></div><div class="stage-strip" id="stageStrip"></div>
<section class="game-card"><div class="card-header"><div><div class="level-tag" id="levelTag">LEVEL 01　·　CHOCOLATE WORKSHOP</div><h2 id="levelTitle"></h2><p id="levelSub"></p></div><div class="difficulty" id="difficulty"></div></div>
<div class="card-body"><div class="diagram-side"><div class="diagram-label">巧克力圖解</div><div class="canvas-wrap" id="canvasWrap"></div><p class="diagram-note" id="diagramNote"></p></div><div class="question-side"><div class="question-kicker">今日幾何挑戰</div><div class="question-title" id="questionTitle"></div><p class="question-hint" id="questionHint"></p><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div></div></div>
<div class="card-footer"><div class="mascot-line"><span class="mascot">🍫</span><span id="mascotText">可可仔：仔細看看圖形提示喔！</span></div><button class="primary-btn" id="nextBtn" disabled>確認答案　→</button></div></section><div style="text-align:center;margin-top:16px" class="footer-meta">邊看圖、邊思考，答對就能獲得可可星！</div></main>
<div class="modal-scrim" id="modalScrim"><div class="modal"><div class="modal-emoji" id="modalEmoji">🍫</div><h2 id="modalTitle"></h2><p id="modalText"></p><div class="modal-score" id="modalScore"></div><button class="primary-btn" id="modalBtn"></button></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
const levels=[
{short:'可可工坊',tag:'LEVEL 01　·　CHOCOLATE WORKSHOP',title:'三角巧克力的祕密',sub:'用畢氏定理找到最完美的巧克力斜邊。',difficulty:'入門・畢氏定理',note:'提示：直角三角形中，斜邊的平方等於兩股平方和。',question:'一片三角形巧克力，兩股長分別是 6 cm 與 8 cm。斜邊長是多少？',hint:'想一想：6² + 8² = ？再開平方根。',choices:['9 cm','10 cm','12 cm','14 cm'],answer:1,correct:'答對了！6² + 8² = 100，√100 = 10 cm。',wrong:'再想一下：36 + 64 = 100，斜邊是 √100 喔！',diagram:'pythagoras'},
{short:'榛果牧場',tag:'LEVEL 02　·　HAZELNUT GARDEN',title:'榛果三角形牧場',sub:'用相似三角形的比例，量出牧場裡的秘密距離。',difficulty:'進階・相似三角形',note:'提示：平行線會截出對應邊成比例的線段。',question:'△ABC 中，DE ∥ BC。若 AD = 3、DB = 2、AE = 6，EC 是多少？',hint:'利用 AD / DB = AE / EC，代入已知數字求出 EC。',choices:['2','3','4','5'],answer:2,correct:'完全正確！3 / 2 = 6 / EC，所以 EC = 4。',wrong:'記得對應線段成比例：3 / 2 = 6 / EC，再解出 EC。',diagram:'similar'},
{short:'蛋糕城堡',tag:'LEVEL 03　·　TRIANGLE CASTLE',title:'巧克力城堡的終極挑戰',sub:'破解三角形角度謎題，拿下幾何大師徽章！',difficulty:'挑戰・三角形角度',note:'提示：三角形內角和為 180°；外角等於兩個不相鄰內角和。',question:'△ABC 中，∠A = 50°。C 點的外角是 120°，∠B 是多少？',hint:'先用外角定理：120° = ∠A + ∠B。',choices:['60°','65°','70°','80°'],answer:2,correct:'城堡通關！外角 120° = 50° + ∠B，所以 ∠B = 70°。',wrong:'外角等於兩個不相鄰內角和：120° = 50° + ∠B。',diagram:'angles'}
];
let current=0,score=0,selected=-1,locked=false,game,scene;
const $=id=>document.getElementById(id);
function drawDiagram(type){if(game){game.destroy(true);game=null;}const wrap=$('canvasWrap');wrap.innerHTML='';const w=Math.max(240,wrap.clientWidth),h=Math.max(190,wrap.clientHeight);const g=new Phaser.Game({type:Phaser.CANVAS,width:w,height:h,parent:'canvasWrap',transparent:true,scene:{create(){scene=this;renderShape(this,type,w,h);}}});game=g;}
function renderShape(s,type,w,h){const gr=s.add.graphics();const txt=(str,x,y,size=13,color='#6a493d',weight='700')=>s.add.text(x,y,str,{fontFamily:'Nunito, Noto Sans TC, sans-serif',fontSize:size+'px',fontStyle:weight,color,align:'center'}).setOrigin(.5);const line=(x1,y1,x2,y2,color='#9d654b',width=2)=>{gr.lineStyle(width,color,1);gr.beginPath();gr.moveTo(x1,y1);gr.lineTo(x2,y2);gr.strokePath();};const dot=(x,y,label,dx=0,dy=0)=>{gr.fillStyle(0x744331,1);gr.fillCircle(x,y,3);txt(label,x+dx,y+dy,12,'#654034','800');};
if(type==='pythagoras'){const A={x:w*.23,y:h*.78},B={x:w*.23,y:h*.22},C={x:w*.78,y:h*.78};line(A.x,A.y,B.x,B.y);line(B.x,B.y,C.x,C.y);line(C.x,C.y,A.x,A.y);gr.fillStyle(0xf2ddc4,.17);gr.fillPoints([new Phaser.Geom.Point(A.x,A.y),new Phaser.Geom.Point(B.x,B.y),new Phaser.Geom.Point(C.x,C.y)],true);gr.lineStyle(1.5,0x9d654b,1);gr.strokeRect(A.x,A.y-13,13,13);txt('6 cm',A.x-25,h*.48,12,'#9c684f');txt('8 cm',w*.5,A.y+19,12,'#9c684f');txt('?',w*.52,h*.48,16,'#ce835e','900');dot(A.x,A.y,'A',-13,12);dot(B.x,B.y,'B',-12,-12);dot(C.x,C.y,'C',12,12);for(let i=0;i<4;i++){gr.fillStyle(0xa96548,1);gr.fillRoundedRect(w*.64+i*12,h*.49,8,8,2)}}
if(type==='similar'){const A={x:w*.17,y:h*.82},B={x:w*.83,y:h*.82},C={x:w*.52,y:h*.15},D={x:w*.38,y:h*.54},E={x:w*.66,y:h*.54};line(A.x,A.y,B.x,B.y);line(A.x,A.y,C.x,C.y);line(B.x,B.y,C.x,C.y);line(D.x,D.y,E.x,E.y,'#c78b68',2);dot(A.x,A.y,'A',-12,12);dot(B.x,B.y,'B',12,12);dot(C.x,C.y,'C',0,-13);dot(D.x,D.y,'D',-12,0);dot(E.x,E.y,'E',12,0);txt('3',w*.32,h*.67,12,'#9c684f');txt('2',w*.3,h*.87,12,'#9c684f');txt('6',w*.58,h*.34,12,'#9c684f');txt('?',w*.69,h*.67,14,'#ce835e','900');for(let i=0;i<3;i++)gr.fillStyle(0x9db99f,1),gr.fillCircle(w*.43+i*13,h*.93,3)}
if(type==='angles'){const A={x:w*.16,y:h*.8},B={x:w*.84,y:h*.8},C={x:w*.52,y:h*.17};line(A.x,A.y,B.x,B.y);line(A.x,A.y,C.x,C.y);line(B.x,B.y,C.x,C.y);line(B.x,B.y,w*.96,h*.8,'#c78b68',2);dot(A.x,A.y,'A',-12,12);dot(B.x,B.y,'B',12,12);dot(C.x,C.y,'C',0,-13);txt('50°',w*.28,h*.72,12,'#9c684f','800');txt('?',w*.73,h*.72,15,'#ce835e','900');txt('120°',w*.91,h*.7,12,'#9c684f','800');gr.lineStyle(1,0xd8b594,.8);gr.beginPath();gr.arc(B.x,B.y,31,Math.PI,Math.PI*1.3,false);gr.strokePath();for(let i=0;i<3;i++){gr.fillStyle(0xe7be68,1);gr.fillCircle(w*.45+i*13,h*.94,4)}}
}
function render(){const l=levels[current];selected=-1;locked=false;$('topLevel').textContent=['第一關','第二關','第三關'][current]+'・'+l.short;$('scoreDisplay').textContent=score;$('progressLabel').textContent=`${current+1} / 3 關`;$('progressFill').style.width=`${(current+1)/3*100}%`;$('levelTag').textContent=l.tag;$('levelTitle').textContent=l.title;$('levelSub').textContent=l.sub;$('difficulty').textContent=l.difficulty;$('diagramNote').textContent=l.note;$('questionTitle').textContent=l.question;$('questionHint').textContent=l.hint;$('feedback').textContent='';$('feedback').className='feedback';$('mascotText').textContent=['可可仔：仔細看看圖形提示喔！','可可仔：線段比例要一一對應！','可可仔：你快成為幾何大師了！'][current];$('nextBtn').disabled=true;$('nextBtn').textContent=current===2?'完成冒險　✦':'確認答案　→';$('answers').innerHTML=l.choices.map((a,i)=>`<button class="answer" data-index="${i}"><span class="answer-key">${String.fromCharCode(65+i)}</span>${a}</button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>choose(+b.dataset.index)));$('stageStrip').innerHTML=levels.map((x,i)=>`<div class="stage-step ${i===current?'active':i<current?'done':''}"><span class="stage-num">${i<current?'✓':String(i+1).padStart(2,'0')}</span><span>${x.short}</span></div>`).join('');drawDiagram(l.diagram)}
function choose(i){if(locked)return;selected=i;document.querySelectorAll('.answer').forEach((b,n)=>b.classList.toggle('selected',n===i));$('feedback').textContent='選好了！按下「確認答案」看看結果。';$('feedback').className='feedback info';$('nextBtn').disabled=false}
function confirmAnswer(){if(selected<0||locked)return;locked=true;const l=levels[current],ok=selected===l.answer;document.querySelectorAll('.answer').forEach((b,i)=>{b.disabled=true;if(i===l.answer)b.classList.add('correct');if(i===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?l.correct:l.wrong;$('feedback').className='feedback '+(ok?'good':'bad');if(ok){score+=10;$('scoreDisplay').textContent=score;showToast('✦ +10 可可星！答對了！')}$('mascotText').textContent=ok?'可可仔：太棒了，收下可可星！':'可可仔：沒關係，記住解題方法就好！';$('nextBtn').textContent=current===2?'完成冒險　✦':'下一關　→';$('nextBtn').dataset.confirmed='yes'}
function next(){if(!$('nextBtn').dataset.confirmed){confirmAnswer();return}delete $('nextBtn').dataset.confirmed;if(current<2){current++;render()}else finish()}
function finish(){const perfect=score===30;$('modalEmoji').textContent=perfect?'🏆':'🍫';$('modalTitle').textContent=perfect?'幾何大師！冒險完成':'巧克力冒險完成！';$('modalText').textContent=perfect?'三道謎題全部答對，可可城堡授予你幾何大師徽章！':'你完成了三個巧克力幾何關卡！每一次思考都讓你更接近幾何大師。';$('modalScore').textContent=`✦ ${score} / 30 可可星`;$('modalBtn').textContent='再玩一次　↻';$('modalBtn').onclick=()=>{$('modalScrim').classList.remove('show');current=0;score=0;render()};$('modalScrim').classList.add('show')}
function showToast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1400)}$('nextBtn').addEventListener('click',next);window.addEventListener('resize',()=>{clearTimeout(window._resize);window._resize=setTimeout(()=>drawDiagram(levels[current].diagram),150)});render();
</script></body></html>
